<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name</title>
  <meta name="description" content="">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #1c2230;
      --text: #2e3440;
      --muted: #6b7280;
      --rule: #d9dde3;
      --accent: #2f4f6f;
      --bg: #ffffff;
    }
    * { box-sizing: border-box; }
    html { font-size: 17px; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Newsreader", "Times New Roman", Georgia, serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--rule); }
    a:hover, a:focus-visible { border-bottom-color: var(--accent); outline: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .page {
      max-width: 1040px;
      margin: 0 auto;
      padding: 4rem 1.5rem 5rem;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 4rem;
    }

    /* Left column */
    aside { position: sticky; top: 3rem; align-self: start; }
    .photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      margin-bottom: 1.25rem;
    }
    aside h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0 0 0.25rem;
      color: var(--ink);
    }
    .role { color: var(--muted); margin: 0 0 1.25rem; font-size: 0.95rem; }
    .contact { list-style: none; padding: 0; margin: 0; font-size: 0.95rem; }
    .contact li { margin-bottom: 0.35rem; }

    /* Right column */
    main h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--ink);
      margin: 0 0 0.9rem;
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--rule);
    }
    section + section { margin-top: 2.75rem; }
    p { margin: 0 0 1rem; max-width: 66ch; }

    .entry {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .entry .when { color: var(--muted); font-size: 0.95rem; }
    .entry .what strong { font-weight: 500; color: var(--ink); }
    .entry .what .sub { display: block; color: var(--muted); font-size: 0.95rem; }

    .pub { margin-bottom: 1.25rem; max-width: 66ch; }
    .pub .title { color: var(--ink); font-weight: 500; }
    .pub .venue { font-style: italic; }
    .pub .links { font-size: 0.9rem; }
    .pub .links a { margin-right: 0.75rem; }

    ul.plain { padding-left: 1.1rem; margin: 0; max-width: 66ch; }
    ul.plain li { margin-bottom: 0.35rem; }

    footer {
      grid-column: 1 / -1;
      margin-top: 3rem;
      padding-top: 1rem;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.9rem;
    }

    @media (max-width: 760px) {
      .page { grid-template-columns: 1fr; gap: 2.5rem; padding-top: 2.5rem; }
      aside { position: static; }
      .photo { width: 160px; }
      .entry { grid-template-columns: 1fr; gap: 0.15rem; }
    }
  </style>
</head>
<body>
  <div class="page">

    <aside>
      <img class="photo" src="photo.jpg" alt="">
      <h1>Your Name</h1>
      <p class="role">Position<br>Affiliation</p>
      <ul class="contact">
        <li><a href="mailto:">Email</a></li>
        <li><a href="#">GitHub</a></li>
        <li><a href="#">Google Scholar</a></li>
        <li><a href="#">CV</a></li>
      </ul>
    </aside>

    <main>
      <section id="about">
        <h2>About</h2>
        <p></p>
      </section>

      <section id="interests">
        <h2>Research Interests</h2>
        <ul class="plain">
          <li></li>
          <li></li>
        </ul>
      </section>

      <section id="publications">
        <h2>Publications</h2>
        <div class="pub">
          <span class="title">Title</span><br>
          <span class="authors">Authors</span><br>
          <span class="venue">Venue</span>, Year<br>
          <span class="links"><a href="#">Paper</a><a href="#">Code</a></span>
        </div>
      </section>

      <section id="experience">
        <h2>Experience</h2>
        <div class="entry">
          <div class="when">Year –</div>
          <div class="what"><strong>Role</strong><span class="sub">Organization</span></div>
        </div>
      </section>

      <section id="education">
        <h2>Education</h2>
        <div class="entry">
          <div class="when">Year –</div>
          <div class="what"><strong>Degree, Institution</strong><span class="sub">Major</span></div>
        </div>
      </section>

      <footer>Last updated: </footer>
    </main>

  </div>
</body>
</html>
